name: Build and publish the add-on

# The add-on image is the gateway plus MediaMTX, on a base Home Assistant can
# run on every architecture it supports. The gateway binary is built from
# source, so this workflow needs no release downloads; the Osaio server key
# and app ID come from the same secrets release.yml uses.
#
# Builds of the same tag merge into one image index: each platform pushes its
# own manifest, and the tag ends up multi-architecture without holding all
# three images on one runner.

"on":
  push:
    branches: ['**']
    paths:
      - 'addon/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/mediamtx.yml'
      - 'deploy/mediamtx.recording.yml'
      - 'deploy/Dockerfile.gateway'
      - '.github/workflows/addon.yml'
  pull_request:
    paths:
      - 'addon/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the add-on files
        run: python3 addon/validate.py

  build:
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
          - platform: linux/arm64
          - platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Forks on pull requests get a read-only token: build, do not push.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the add-on image
        env:
          BOMBECAM_SERVER_KEY: ${{ secrets.OSAIO_SERVER_KEY }}
          BOMBECAM_APP_ID: ${{ secrets.OSAIO_APP_ID }}
          OWNER: ${{ github.repository_owner }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/bombecam-addon"

          tag="dev"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          fi

          push="--push"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            push=""
          fi

          docker buildx build \
            ${push} \
            --platform "${PLATFORM}" \
            --file addon/Dockerfile \
            --build-arg "BOMBECAM_SERVER_KEY=${BOMBECAM_SERVER_KEY}" \
            --build-arg "BOMBECAM_APP_ID=${BOMBECAM_APP_ID}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${tag}" \
            --tag "${image}:${tag}" \
            .
          echo "built ${image}:${tag} for ${PLATFORM}"

  # A release tags the image with its version, its major number and latest,
  # the same way release.yml tags the gateway image.
  tags:
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the version, major and latest tags
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/bombecam-addon"
          ver="${TAG#v}"
          docker buildx imagetools create \
            --tag "${image}:${ver}" \
            --tag "${image}:${ver%%.*}" \
            --tag "${image}:latest" \
            "${image}:${ver}"

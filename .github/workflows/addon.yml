name: Build and publish the add-on

# The add-on image is the gateway plus MediaMTX on an Alpine base, with the
# gateway built from source, so this workflow needs no release downloads. The
# Osaio server key and app ID come from the same repository secrets release.yml
# uses.
#
# Images are built in two steps:
#   1. assemble: the repository without the heavy folders, addon/ in place;
#   2. build one image per architecture on the matching runner, so arm64 is
#      built natively instead of through QEMU.
# Each build pushes its own manifest to ghcr, so the :dev tag is a multi-arch
# index whose entries arrive as the runners finish.

"on":
  push:
    branches: ['**']
    paths:
      - 'addon/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'tools/**'
      - 'go.mod'
      - 'go.sum'
      - 'deploy/mediamtx.yml'
      - 'deploy/mediamtx.recording.yml'
      - '.github/workflows/addon.yml'
  pull_request:
    paths:
      - 'addon/**'
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/addon.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the add-on files
        run: python3 addon/validate.py

  assemble:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Collect the add-on into a clean context
        run: |
          set -euo pipefail
          # Only the folders the gateway build reads, plus the add-on files at
          # the top: addon/Dockerfile names run.sh and the MediaMTX configs
          # without a folder, the same way Home Assistant's add-on builder
          # sees its context.
          mkdir -p /tmp/context
          cp -R cmd internal pkg tools web go.mod go.sum LICENSE /tmp/context/
          cp addon/Dockerfile addon/run.sh addon/mediamtx.yml \
             addon/mediamtx.recording.yml /tmp/context/
          if [ -f osaio-setup.txt ]; then cp osaio-setup.txt /tmp/context/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: addon-context
          path: /tmp/context
          retention-days: 1

  build:
    runs-on: ${{ matrix.runs_on }}
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs_on: ubuntu-latest
          - platform: linux/arm64
            runs_on: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runs_on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: addon-context
          path: context

      - uses: docker/setup-buildx-action@v3

      # Forks on pull requests get a read-only token: build, do not push.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the add-on image
        env:
          BOMBECAM_SERVER_KEY: ${{ secrets.OSAIO_SERVER_KEY }}
          BOMBECAM_APP_ID: ${{ secrets.OSAIO_APP_ID }}
          OWNER: ${{ github.repository_owner }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/bombecam-addon"

          tag="dev"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
          elif [[ "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME#v}"
          fi

          push="--push"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            push=""
          fi

          docker buildx build \
            ${push} \
            --platform "${PLATFORM}" \
            --file context/Dockerfile \
            --build-arg "BOMBECAM_SERVER_KEY=${BOMBECAM_SERVER_KEY}" \
            --build-arg "BOMBECAM_APP_ID=${BOMBECAM_APP_ID}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${tag}" \
            --tag "${image}:${tag}" \
            context
          echo "built ${image}:${tag} for ${PLATFORM}"

  # A release tags the image with its version, its major number and latest,
  # the same way release.yml tags the gateway image.
  tags:
    if: >-
      github.event_name == 'release' &&
      !github.event.release.prerelease &&
      !contains(github.event.release.tag_name, '-')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Add the version, major and latest tags
        env:
          OWNER: ${{ github.repository_owner }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${OWNER,,}/bombecam-addon"
          ver="${TAG#v}"
          docker buildx imagetools create \
            --tag "${image}:${ver%%.*}" \
            --tag "${image}:latest" \
            "${image}:${ver}"
